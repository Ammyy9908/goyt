name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Node.js for JavaScript challenge solver
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install FFmpeg and verify required media encoders
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version

          encoder_list="$(ffmpeg -hide_banner -encoders 2>&1)"

          for enc in aac alac flac libmp3lame libopus libvorbis pcm_s16le libx264 libvpx-vp9; do
            if ! awk -v wanted="$enc" '
              $2 == wanted { found = 1 }
              END { exit !found }
            ' <<< "$encoder_list"; then
              echo "Missing required encoder: $enc"
              exit 1
            fi
            echo "Found required encoder: $enc"
          done

      - name: Check formatting
        shell: bash
        run: |
          mapfile -d '' files < <(git ls-files -z '*.go')
          unformatted=$(gofmt -l "${files[@]}")
          if [[ -n "$unformatted" ]]; then
            echo "Run go fmt ./... and commit the changes:"
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: Static analysis
        run: go vet ./...

      - name: Unit tests with race detector
        env:
          GOYT_REQUIRE_JS_RUNTIME: "true"
        run: go test -race -count=1 -timeout=5m ./...

      - name: Local integration tests
        env:
          GOYT_REQUIRE_ALL_ENCODERS: "true"
          GOYT_REQUIRE_JS_RUNTIME: "true"
        run: |
          go test -race -tags=integration -count=1 -timeout=5m -v ./...

      - name: Build commands
        run: |
          go build -o ./bin/goyt ./cmd/goyt

      - name: Check primary CLI
        run: |
          ./bin/goyt -version
          ./bin/goyt -help