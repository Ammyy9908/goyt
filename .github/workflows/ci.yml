name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Check formatting
        shell: bash
        run: |
          mapfile -d '' files < <(git ls-files -z '*.go')
          unformatted=$(gofmt -l "${files[@]}")
          if [[ -n "$unformatted" ]]; then
            echo "Run go fmt ./... and commit the changes:"
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: Static analysis
        run: go vet ./...

      - name: Unit tests with race detector
        run: go test -race -count=1 -timeout=5m ./...

      - name: Local integration tests
        run: |
          go test -race -tags=integration \
            -run '^(TestFFmpegIntegration|TestExecutorIntegration)$' \
            -count=1 -timeout=5m -v ./...

      - name: Build commands
        run: |
          go build -o ./bin/goyt ./cmd/goyt
          go build -o ./bin/goyt-inspect ./cmd/goyt-inspect
          go build -o ./bin/goyt-hls ./cmd/goyt-hls

      - name: Check primary CLI
        run: |
          ./bin/goyt -version
          ./bin/goyt -help